[package]
name = "cairn-cli"
description = "CairnLauncher debug command-line tool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-core = { workspace = true, features = ["cli"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
anyhow = "1"
serde_json = "1"
cairn-plugin.workspace = true
