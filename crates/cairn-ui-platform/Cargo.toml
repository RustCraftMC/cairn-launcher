[package]
name = "cairn-ui-platform"
description = "cairn-ui platform layer: windows, event loop, presentation (OpenGL or software), IME, DPI, clipboard, font directories"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/xiaojiang233/cairn-ui"
publish.workspace = true

[dependencies]
winit = { workspace = true }
softbuffer = { workspace = true }
sys-locale = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
glutin = { workspace = true }
glutin-winit = { workspace = true }
glow = { workspace = true }
raw-window-handle = { workspace = true }

# Linux backends: not yet compile-checked on Linux.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
winit = { workspace = true, features = ["x11", "wayland", "wayland-dlopen"] }
softbuffer = { workspace = true, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
