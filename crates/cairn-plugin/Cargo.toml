[package]
name = "cairn-plugin"
description = "Script plugins: package manifests, the QuickJS host process and its supervisor."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Only the module loader feature: no dynamic native modules, no custom allocator (it would disable
# the memory limit) and no parallel runtime.
rquickjs = { version = "0.14.0", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
# Same version and features as cairn-core, so it is not compiled twice.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "gzip", "form"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
